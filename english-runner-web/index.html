<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Irregular Surfers</title>
    <style>
        :root {
            --primary: #38bdf8;
            --bg: #0f172a;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: var(--bg);
            font-family: 'Segoe UI', sans-serif; color: white;
            touch-action: none; /* Відключає зум при тапах */
        }

        #game-container {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Дорога (ефект руху) */
        .road {
            position: absolute; bottom: 0; width: 300px; height: 100%;
            background: linear-gradient(to bottom, #1e293b 0%, #334155 100%);
            border-left: 4px solid var(--primary); border-right: 4px solid var(--primary);
            overflow: hidden;
        }

        .lane-line {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 2px; height: 100%; background: rgba(255,255,255,0.1);
        }

        /* Гравець */
        #player {
            position: absolute; bottom: 50px; width: 60px; height: 80px;
            background: var(--primary); border-radius: 10px;
            transition: left 0.2s ease-out; transform: translateX(-50%);
            box-shadow: 0 0 20px var(--primary);
            z-index: 10;
        }

        /* Об'єкти (слова) */
        .word-obj {
            position: absolute; width: 80px; text-align: center;
            font-weight: bold; font-size: 1.2rem; transform: translateX(-50%);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Інтерфейс */
        #ui {
            position: absolute; top: 20px; width: 90%;
            display: flex; justify-content: space-between; z-index: 100;
        }

        #target-verb {
            position: absolute; top: 80px; font-size: 2rem;
            color: var(--primary); font-weight: 800; text-align: center;
        }

        #menu {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 200;
        }

        .btn {
            background: var(--primary); color: var(--bg);
            border: none; padding: 15px 40px; border-radius: 30px;
            font-weight: bold; font-size: 1.2rem; cursor: pointer; margin: 10px;
        }

        .lives { color: #f87171; font-size: 1.5rem; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="score">Score: 0</div>
        <div class="lives" id="lives">♥♥♥</div>
    </div>

    <div id="target-verb">PRESS START</div>

    <div class="road">
        <div class="lane-line"></div>
        <div id="player" style="left: 50%;"></div>
        <div id="words-layer"></div>
    </div>

    <div id="menu">
        <h1>IRREGULAR SURFERS</h1>
        <button class="btn" onclick="startGame()">START GAME</button>
        <p style="color: #94a3b8; font-size: 0.8rem;">PC: Arrows | Mobile: Tap Sides</p>
    </div>
</div>

<script>
    const verbs = [
        { v1: "Go", correct: "went", wrong: "goed" },
        { v1: "Be", correct: "was", wrong: "beed" },
        { v1: "Do", correct: "did", wrong: "done" },
        { v1: "Have", correct: "had", wrong: "haved" },
        { v1: "See", correct: "saw", wrong: "seen" }
    ];

    let gameState = "menu";
    let score = 0;
    let lives = 3;
    let playerLane = 1; // 0: left, 1: center, 2: right
    let speed = 4;
    let gameLoop;

    const lanes = [75, 150, 225]; // координати центрів колій

    // Керування (ПК)
    document.addEventListener('keydown', (e) => {
        if (e.key === "ArrowLeft" && playerLane > 0) playerLane--;
        if (e.key === "ArrowRight" && playerLane < 2) playerLane++;
        updatePlayerPosition();
    });

    // Керування (Телефон - Тапи)
    document.addEventListener('touchstart', (e) => {
        const x = e.touches[0].clientX;
        if (x < window.innerWidth / 2) {
            if (playerLane > 0) playerLane--;
        } else {
            if (playerLane < 2) playerLane++;
        }
        updatePlayerPosition();
    });

    function updatePlayerPosition() {
        document.getElementById('player').style.left = lanes[playerLane] + 'px';
    }

    function startGame() {
        gameState = "play";
        score = 0;
        lives = 3;
        speed = 4;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('score').innerText = `Score: ${score}`;
        document.getElementById('lives').innerText = "♥♥♥";
        spawnPair();
        gameLoop = setInterval(update, 20);
    }

    function spawnPair() {
        const verb = verbs[Math.floor(Math.random() * verbs.length)];
        document.getElementById('target-verb').innerText = `V2 of ${verb.v1}?`;

        const isCorrectLeft = Math.random() > 0.5;
        createWord(verb.correct, isCorrectLeft ? 0 : 2, true);
        createWord(verb.wrong, isCorrectLeft ? 2 : 0, false);
    }

    function createWord(text, lane, isCorrect) {
        const el = document.createElement('div');
        el.className = 'word-obj';
        el.innerText = text;
        el.style.top = '-50px';
        el.style.left = lanes[lane] + 'px';
        el.dataset.lane = lane;
        el.dataset.correct = isCorrect;
        document.getElementById('words-layer').appendChild(el);
    }

    function update() {
        const words = document.getElementsByClassName('word-obj');
        for (let word of Array.from(words)) {
            let top = parseInt(word.style.top);
            top += speed;
            word.style.top = top + 'px';

            // Перевірка зіткнення
            if (top > window.innerHeight - 130 && top < window.innerHeight - 50) {
                if (parseInt(word.dataset.lane) === playerLane) {
                    if (word.dataset.correct === "true") {
                        score += 10;
                        document.getElementById('score').innerText = `Score: ${score}`;
                        speed += 0.1;
                    } else {
                        lives--;
                        document.getElementById('lives').innerText = "♥".repeat(lives);
                    }
                    word.remove();
                    if (lives <= 0) gameOver();
                    else spawnPair();
                }
            }

            if (top > window.innerHeight) word.remove();
        }
    }

    function gameOver() {
        clearInterval(gameLoop);
        gameState = "menu";
        document.getElementById('menu').style.display = 'flex';
        document.getElementById('menu').innerHTML = `<h1>GAME OVER</h1><p>Score: ${score}</p><button class="btn" onclick="location.reload()">RETRY</button>`;
    }

    updatePlayerPosition();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Verbs Game</title>
    <style>
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 30px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #38bdf8;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>

    <h1>Irregular Verbs</h1>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>Infinitive (V1)</th>
                    <th>Past Simple (V2)</th>
                    <th>Past Participle (V3)</th>
                    <th>Translation</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Be</td>
                    <td>Was / Were</td>
                    <td>Been</td>
                    <td>Бути</td>
                </tr>
                <tr>
                    <td>Begin</td>
                    <td>Began</td>
                    <td>Begun</td>
                    <td>Починати</td>
                </tr>
                <tr>
                    <td>Do</td>
                    <td>Did</td>
                    <td>Done</td>
                    <td>Робити</td>
                </tr>
                <tr>
                    <td>Go</td>
                    <td>Went</td>
                    <td>Gone</td>
                    <td>Йти</td>
                </tr>
                </tbody>
        </table>
    </div>

</body>
</html>
